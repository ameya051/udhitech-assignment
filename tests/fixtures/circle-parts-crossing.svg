<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><title>Parts of a circle</title><rect width="800" height="500" fill="#fff"/><circle cx="400" cy="260" r="160" fill="#eef5ff" stroke="#0b3d91" stroke-width="5"/><line x1="240" y1="260" x2="560" y2="260" stroke="#c0392b" stroke-width="5"/><line x1="400" y1="260" x2="513" y2="373" stroke="#1e8449" stroke-width="5"/><circle cx="400" cy="260" r="7" fill="#000"/><circle r="9" fill="#e67e22"><animateMotion dur="8s" repeatCount="indefinite" path="M400,100 A160,160 0 1,1 399.9,100 Z"/></circle><text x="400" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#000">Parts of a circle</text><text x="400" y="244" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c0392b">Diameter = 2 × radius</text><text x="400" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#000">Centre</text><text x="500" y="340" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1e8449" transform="rotate(45 500 340)">Radius</text><text x="580" y="140" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e67e22">Circumference</text><text x="580" y="162" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e67e22">(distance around)</text></svg>
