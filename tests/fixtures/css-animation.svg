<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>CSS animated</title>
  <style>
    @keyframes pulse { from { opacity: 0.2; } to { opacity: 1; } }
    .dot { animation: pulse 2s ease-in-out infinite alternate; }
  </style>
  <circle class="dot" cx="200" cy="150" r="20" />
  <text x="10" y="20">One</text>
  <text x="10" y="40">Two</text>
  <text x="10" y="60">Three</text>
</svg>
