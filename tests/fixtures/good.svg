<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <title>Parts of a circle</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5">
      <path d="M0 0 L10 5 L0 10 Z" />
    </marker>
  </defs>
  <circle cx="200" cy="150" r="100" fill="none" stroke="#333" stroke-width="3" />
  <g transform="translate(200 150) rotate(30)">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#c00" stroke-width="2">
      <animate attributeName="x2" values="0;100" dur="2s" repeatCount="indefinite" />
    </line>
  </g>
  <path d="M120 150 a80 80 0 0 1 160 0 C 280 200 200 220 120 150 z" fill="none" stroke="#06c" />
  <text x="200" y="145" text-anchor="middle" font-size="14">Centre</text>
  <text x="395" y="290" text-anchor="end" font-size="16">Circumference</text>
  <text x="10" y="30"><tspan font-weight="bold">Radius</tspan> and diameter</text>
</svg>
